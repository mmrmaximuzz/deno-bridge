<!DOCTYPE html>
<html>
    <head>
        <title>Deno Bridge</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="utf-8">
        <script type="module" src="main.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page">
            <div class="game-table" style="grid-area: page-game-table">
                <div style="grid-area: top-player" class="center" id="top-hand"></div>
                <div style="grid-area: left-player" class="center" id="left-hand"></div>
                <div style="grid-area: right-player" class="center" id="right-hand"></div>
                <div style="grid-area: bottom-player" class="center" id="bottom-hand"></div>

                <div style="grid-area: table" class="table">
                    <div></div>
                    <div></div>
                    <div id="top-side" class="center" style="font-weight: bolder"></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div id="top-card" class="center"></div>
                    <div></div>
                    <div></div>

                    <div id="left-side" class="center" style="font-weight: bolder"></div>
                    <div id="left-card" class="center"></div>
                    <div></div>
                    <div id="right-card" class="center"></div>
                    <div id="right-side" class="center" style="font-weight: bolder"></div>

                    <div></div>
                    <div></div>
                    <div id="bottom-card" class="center"></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div id="bottom-side" class="center" style="font-weight: bolder"></div>
                    <div></div>
                    <div></div>
                </div>
            </div>

            <div class="auction-chat" style="grid-area: page-auction-chat">
                <div style="grid-area: auction">
                    <table id="auction" width="100%">
                        <tr>
                            <td id="bid-1-c" class="bid"><span class="suit-c">1♣</span></td>
                            <td id="bid-1-d" class="bid"><span class="suit-d">1♦</span></td>
                            <td id="bid-1-h" class="bid"><span class="suit-h">1♥</span></td>
                            <td id="bid-1-s" class="bid"><span class="suit-s">1♠</span></td>
                            <td id="bid-1-n" class="bid"><span class="suit-n">1NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-2-c" class="bid"><span class="suit-c">2♣</span></td>
                            <td id="bid-2-d" class="bid"><span class="suit-d">2♦</span></td>
                            <td id="bid-2-h" class="bid"><span class="suit-h">2♥</span></td>
                            <td id="bid-2-s" class="bid"><span class="suit-s">2♠</span></td>
                            <td id="bid-2-n" class="bid"><span class="suit-n">2NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-3-c" class="bid"><span class="suit-c">3♣</span></td>
                            <td id="bid-3-d" class="bid"><span class="suit-d">3♦</span></td>
                            <td id="bid-3-h" class="bid"><span class="suit-h">3♥</span></td>
                            <td id="bid-3-s" class="bid"><span class="suit-s">3♠</span></td>
                            <td id="bid-3-n" class="bid"><span class="suit-n">3NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-4-c" class="bid"><span class="suit-c">4♣</span></td>
                            <td id="bid-4-d" class="bid"><span class="suit-d">4♦</span></td>
                            <td id="bid-4-h" class="bid"><span class="suit-h">4♥</span></td>
                            <td id="bid-4-s" class="bid"><span class="suit-s">4♠</span></td>
                            <td id="bid-4-n" class="bid"><span class="suit-n">4NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-5-c" class="bid"><span class="suit-c">5♣</span></td>
                            <td id="bid-5-d" class="bid"><span class="suit-d">5♦</span></td>
                            <td id="bid-5-h" class="bid"><span class="suit-h">5♥</span></td>
                            <td id="bid-5-s" class="bid"><span class="suit-s">5♠</span></td>
                            <td id="bid-5-n" class="bid"><span class="suit-n">5NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-6-c" class="bid"><span class="suit-c">6♣</span></td>
                            <td id="bid-6-d" class="bid"><span class="suit-d">6♦</span></td>
                            <td id="bid-6-h" class="bid"><span class="suit-h">6♥</span></td>
                            <td id="bid-6-s" class="bid"><span class="suit-s">6♠</span></td>
                            <td id="bid-6-n" class="bid"><span class="suit-n">6NT</span></td>
                        </tr>
                        <tr>
                            <td id="bid-7-c" class="bid"><span class="suit-c">7♣</span></td>
                            <td id="bid-7-d" class="bid"><span class="suit-d">7♦</span></td>
                            <td id="bid-7-h" class="bid"><span class="suit-h">7♥</span></td>
                            <td id="bid-7-s" class="bid"><span class="suit-s">7♠</span></td>
                            <td id="bid-7-n" class="bid"><span class="suit-n">7NT</span></td>
                        </tr>
                        <tr>
                            <td
                                id="bid-0-pass"
                                class="bid"
                                colspan="3"
                                style="background-color: green; color: white"
                            >
                                PASS
                            </td>
                            <td
                                id="bid-0-x"
                                class="bid"
                                style="background-color: red; color: white"
                            >
                                X
                            </td>
                            <td
                                id="bid-0-xx"
                                class="bid"
                                style="background-color: blue; color: white"
                            >
                                XX
                            </td>
                        </tr>
                    </table>
                    <hr>
                    <table id="auction-history" width="100%">
                        <tr>
                            <th>W</th>
                            <th>N</th>
                            <th>E</th>
                            <th>S</th>
                        </tr>
                    </table>
                    <div id="auction-result"></div>
                    <div id="scores" style="visibility: hidden">
                        W/E: <span id="we-score">0</span><br>
                        N/S: <span id="ns-score">0</span>
                    </div>
                </div>
                <div style="grid-area: chat">
                    <button id="next-deal" disabled>Next deal</button>
                    <form id="chat-form">
                        <input id="chat-input" />
                    </form>
                    <div id="messages"></div>
                </div>
            </div>
        </div>
    </body>
</html>
